<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pokémon Zafiro Alfa · Duelos</title>
<style>
:root{--navy:#0d1b3a;--sap:#2f7bff;--sky:#8fd0ff;--ink:#eaf3ff;--gold:#ffd24a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#06122b;color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:0}
input,select,textarea{font:inherit}
.screen{position:absolute;inset:0;display:none;overflow:auto;background:
  radial-gradient(1200px 500px at 80% -10%,#3b8cff55,transparent 60%),
  linear-gradient(180deg,#0a2a6b 0%,#0b3c8f 45%,#06265e 100%)}
.screen.on{display:block}
.waves{z-index:0;position:fixed;left:0;right:0;bottom:0;height:90px;pointer-events:none;opacity:.35;
  background:repeating-radial-gradient(circle at 50% 160%,transparent 0 22px,#9fd4ff 23px 25px);animation:wv 9s linear infinite;background-size:240px 100%}
@keyframes wv{to{background-position:240px 0}}
.btn{background:linear-gradient(#3d8bff,#1f5fd6);border:2px solid #bfe0ff;border-radius:12px;padding:10px 22px;font-weight:700;box-shadow:0 4px 0 #0b2f78;transition:.1s}
.btn:hover{filter:brightness(1.12)}.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0b2f78}
.btn.gold{background:linear-gradient(#ffd95e,#e8a417);color:#3a2600;border-color:#fff3b8;box-shadow:0 4px 0 #8a5a00}
.btn.ghost{background:#ffffff18;box-shadow:none;border-color:#ffffff55}
.btn.sm{padding:5px 12px;font-size:13px;box-shadow:0 2px 0 #0b2f78;border-radius:9px}
.btn[disabled]{opacity:.4;pointer-events:none}
.tchip{display:inline-block;padding:1px 8px;border-radius:9px;font-size:11px;font-weight:700;color:#fff;text-shadow:0 1px 1px #0006;margin-right:3px}
#loading{position:fixed;inset:0;z-index:100;background:#06122b;display:flex;align-items:center;justify-content:center;font-size:22px;text-align:center;padding:20px}

/* TITLE */
#scr-title.on{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center}
.logo{font-size:clamp(34px,7vw,76px);font-weight:900;line-height:1;background:linear-gradient(#fff,#8fd0ff 60%,#2f7bff);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #04204f) drop-shadow(0 0 18px #4aa0ff)}
.logo small{display:block;font-size:.38em;letter-spacing:.5em;color:#ffd24a;-webkit-text-fill-color:#ffd24a;margin-top:6px}
.tag{opacity:.8;max-width:560px;padding:0 16px}
.titlebtns{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.gem{width:90px;height:90px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#7cc0ff 30%,#1c5fe0 70%,#06265e);box-shadow:0 0 40px #4aa0ff,inset 0 -8px 16px #0006;animation:fl 3s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-10px)}}
.stats-line{font-size:12px;opacity:.65}

/* TEAM */
.wrap{max-width:1380px;margin:0 auto;padding:18px 16px 40px;position:relative;z-index:1}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.topbar h2{flex:1;font-size:26px}
.team-layout{display:grid;grid-template-columns:minmax(0,1fr) 470px;gap:16px}
@media(max-width:980px){.team-layout{grid-template-columns:1fr}}
.panel{background:#0b1d44cc;border:2px solid #5aa6ff88;border-radius:14px;padding:12px;backdrop-filter:blur(4px)}
.team-layout>.panel:last-child{position:sticky;top:10px;align-self:start;max-height:calc(100vh - 20px);overflow:auto}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;align-items:center}
.filters input[type=text]{background:#04122f;border:2px solid #5aa6ff88;border-radius:8px;color:#fff;padding:6px 10px;width:170px;user-select:text}
.fchip{padding:2px 9px;border-radius:9px;font-size:11px;font-weight:700;color:#fff;opacity:.55;border:2px solid transparent;cursor:pointer}
.fchip.on{opacity:1;border-color:#fff}
.fchip.g{background:#3b5fa8}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px;max-height:calc(100vh - 230px);overflow:auto;padding-right:4px}
.card{position:relative;background:linear-gradient(#17356f,#0c2150);border:2px solid #3c76d4;border-radius:10px;text-align:center;padding:4px 2px 6px;cursor:pointer;transition:.1s}
.card:hover{transform:translateY(-2px);border-color:#bfe0ff}
.card .ic{height:64px;display:flex;align-items:center;justify-content:center}
.card .ic img{max-height:64px;max-width:80px}
.card b{font-size:12px;line-height:1.15;min-height:28px;display:flex;align-items:center;justify-content:center}
.card small{position:absolute;left:5px;top:3px;font-size:10px;opacity:.6}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.slot{display:flex;align-items:center;gap:6px;background:#102a5e;border:2px solid #3c76d4;border-radius:10px;padding:3px 6px;cursor:pointer;min-height:54px;position:relative}
.slot.act{border-color:var(--gold);box-shadow:0 0 10px #ffd24a77}
.slot .ic{width:44px;height:44px;display:flex;align-items:center;justify-content:center}
.slot .ic img{max-width:44px;max-height:44px}
.slot b{font-size:12px;line-height:1.1;display:block}
.slot .x{position:absolute;right:3px;top:3px;background:#ff4d5e;border-radius:50%;width:18px;height:18px;font-weight:900;line-height:16px;font-size:12px}
.slot.empty{opacity:.45;justify-content:center;font-size:12px}
.ed{margin-top:10px;font-size:13px}
.ed h3{font-size:16px;margin-bottom:4px}
.ed .row{display:flex;gap:8px;margin:6px 0;align-items:flex-end;flex-wrap:wrap}
.ed label{display:flex;flex-direction:column;font-size:11px;opacity:.95;gap:2px;flex:1;min-width:90px}
.ed input,.ed select{background:#04122f;color:#fff;border:2px solid #5aa6ff88;border-radius:8px;padding:5px 7px;width:100%;user-select:text}
.ed input.bad{border-color:#ff5d6c}
.ed .desc{font-size:11px;opacity:.8;margin-top:2px;min-height:14px}
.mvrow{margin:5px 0}
.mvrow .tags{font-size:11px;opacity:.9;margin-top:2px;min-height:15px}
.evgrid{display:grid;grid-template-columns:34px repeat(6,1fr);gap:3px;align-items:center;text-align:center;font-size:11px}
.evgrid input{padding:3px 2px;text-align:center}
.evgrid .hd{opacity:.7}
.toggle{display:flex;align-items:center;gap:6px;font-size:12px;margin:4px 0}
.toggle input{width:auto}
#ieBox{display:none;margin-top:8px}
#ieBox textarea{width:100%;height:170px;background:#04122f;color:#fff;border:2px solid #5aa6ff88;border-radius:8px;padding:6px;font-size:12px;user-select:text}

/* TRAINERS */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.tcard{background:linear-gradient(#1a3d82,#0b2150);border:2px solid #5aa6ff;border-radius:14px;padding:12px;display:flex;gap:10px;flex-direction:column;position:relative;overflow:hidden}
.tcard .hd{display:flex;gap:10px;align-items:center}
.avatar{width:72px;height:72px;border-radius:50%;background:radial-gradient(circle at 40% 30%,#6fb1ff,#16397a);border:3px solid #cfe6ff;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;font-size:34px;font-weight:900}
.avatar img{height:96px;margin-bottom:-6px}
.tcard h3{font-size:18px}.tcard em{opacity:.75;font-size:12px}
.tcard .prev{display:flex;gap:2px;flex-wrap:wrap}.tcard .prev img{width:40px;height:34px;object-fit:contain}
.tcard .q{font-size:12px;opacity:.8;font-style:italic}
.medal{position:absolute;top:8px;right:10px;font-size:22px}

/* BATTLE */
#scr-battle{background:#000;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:960px;height:540px;transform:translate(-50%,-50%) scale(var(--s,1));overflow:hidden;background:#000}
#bg{position:absolute;inset:0;width:960px;height:540px}
.anchor{position:absolute;transform:translate(-50%,-100%);width:0;height:0;z-index:5}
.anchor img,.anchor .blob{position:absolute;left:0;bottom:0;transform:translateX(-50%);transform-origin:50% 100%;filter:drop-shadow(0 6px 4px #0005)}
.blob{display:flex;align-items:center;justify-content:center;font-weight:900;font-size:44px;color:#fff;text-shadow:0 2px 4px #0008;border-radius:50% 50% 42% 42%;border:4px solid #ffffff99}
.pix{image-rendering:pixelated}
#fx{position:absolute;inset:0;pointer-events:none;z-index:9}
.proj{position:absolute;width:42px;height:42px;margin:-21px 0 0 -21px;border-radius:50%}
.ring{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:6px solid #fff}
.hud{position:absolute;z-index:8;width:330px;padding:7px 14px 8px;border-radius:8px 26px 8px 26px;background:linear-gradient(#26407a,#101d3e);border:3px solid #9fd0ff;box-shadow:0 4px 12px #0007}
.hud .r1{display:flex;justify-content:space-between;align-items:baseline;font-weight:800;font-size:19px;gap:6px}
.hud .r1 .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud .lv{font-size:14px;color:#ffe08a;white-space:nowrap}
.hud .hp{display:flex;align-items:center;gap:6px;margin-top:3px}
.hud .ps{font-size:11px;font-weight:900;color:#ffb347;background:#0008;padding:0 5px;border-radius:5px}
.hud .bar{flex:1;height:11px;border-radius:6px;background:#050a18;border:2px solid #c8dcff;overflow:hidden}
.hud .bar i{display:block;height:100%;width:100%;background:#3ddc6b;transition:width .9s linear,background .3s}
.hud .bar i.y{background:#f5c518}.hud .bar i.r{background:#f2453d}
.hud .r3{display:flex;justify-content:space-between;align-items:center;margin-top:3px;min-height:18px;font-size:13px;gap:6px}
.hud .st{font-size:11px;font-weight:900;padding:1px 8px;border-radius:6px;color:#fff;margin-right:4px}
.balls i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-left:3px;border:2px solid #fff;background:linear-gradient(#e63946 50%,#fff 50%)}
.balls i.dead{background:#555;border-color:#999}
#foeHud{left:22px;top:22px}
#plHud{left:600px;top:306px}
#textbox{position:absolute;left:0;right:0;bottom:0;height:112px;z-index:12;background:linear-gradient(#142a5c,#07122b);border-top:4px solid #9fd0ff;display:flex}
#msg{flex:1;padding:16px 26px;font-size:25px;line-height:1.3;text-shadow:0 2px 0 #000a;overflow:hidden}
#cmd{display:none;width:480px;padding:8px 12px 8px 0;gap:6px;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
#cmd.on{display:grid}
.cbtn{border-radius:10px;font-weight:800;font-size:17px;line-height:1.1;border:3px solid #fff;color:#fff;text-shadow:0 2px 0 #0008;box-shadow:inset 0 -6px 0 #0004,0 3px 0 #0006;position:relative;text-align:left;padding:1px 12px;min-height:0;overflow:hidden}
.cbtn:hover{filter:brightness(1.15)}
.cbtn small{display:block;font-size:10px;font-weight:600;opacity:.95}
.cbtn .ef{position:absolute;right:8px;top:6px;font-size:12px;font-weight:900;background:#000a;padding:0 6px;border-radius:6px}
.cbtn[disabled]{opacity:.4;pointer-events:none}
#switch{position:absolute;inset:0;z-index:20;background:#041030ee;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px}
#switch.on{display:flex}
#switch h3{font-size:24px}
.sgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;width:880px}
.sc{display:flex;align-items:center;gap:8px;background:linear-gradient(#1d438d,#0e2556);border:3px solid #6fb1ff;border-radius:12px;padding:6px 10px;height:84px;text-align:left}
.sc:hover{border-color:var(--gold)}
.sc.dead{filter:grayscale(1);opacity:.5;pointer-events:none}
.sc .ic{width:56px;height:56px;display:flex;align-items:center;justify-content:center}
.sc .ic img{max-width:56px;max-height:56px}
.sc b{font-size:15px}.sc .mini{height:8px;width:120px;background:#050a18;border-radius:4px;overflow:hidden;margin-top:3px}
.sc .mini i{display:block;height:100%;background:#3ddc6b}
.sc small{font-size:11px;opacity:.85}
#hudtools{position:absolute;right:8px;top:6px;z-index:15;display:flex;gap:6px}
#hudtools button{background:#0008;border:1px solid #fff6;border-radius:8px;padding:3px 10px;font-size:13px}
#intro{position:absolute;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:linear-gradient(90deg,#0a2a6b,#2f7bff,#0a2a6b);overflow:hidden}
#intro.on{display:flex}
#intro .vs{font-size:84px;font-weight:900;color:#fff;text-shadow:0 5px 0 #04204f;font-style:italic}
#intro .side{width:300px;text-align:center;font-size:30px;font-weight:900}
#intro .side .avatar{width:150px;height:150px;margin:0 auto 8px;font-size:60px}
#intro .side .avatar img{height:200px}
#result{position:absolute;inset:0;z-index:40;background:#000c;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
#result.on{display:flex}
#result h2{font-size:56px;text-shadow:0 4px 0 #04204f}
#wx{position:absolute;inset:0;z-index:7;pointer-events:none;opacity:0;transition:opacity .6s}
#wx.rain{opacity:1;background:repeating-linear-gradient(105deg,transparent 0 14px,#d6ecff66 14px 15px),linear-gradient(#0a2a5a33,#0a2a5a22);animation:rain .45s linear infinite}
@keyframes rain{to{background-position:-30px 60px,0 0}}
#wx.sun{opacity:1;background:radial-gradient(circle at 85% 0,#ffd76acc,#ffb34733 45%,transparent 72%)}
#wx.sand{opacity:1;background:repeating-linear-gradient(170deg,#e0b86a22 0 6px,#c9974a33 6px 9px),#c9974a33;animation:sand 1s linear infinite}
#wx.snow{opacity:1;background:repeating-linear-gradient(100deg,transparent 0 22px,#ffffff88 22px 24px),#cfe9ff33;animation:rain .9s linear infinite}
@keyframes sand{to{background-position:60px 0,0 0}}
#wlabel{position:absolute;left:26px;top:134px;z-index:8;font-weight:800;font-size:15px;text-shadow:0 2px 2px #000}
.tbtn{position:absolute;z-index:3;background:#0009;border:2px solid #fff8;border-radius:8px;padding:4px 10px;font-weight:700;font-size:14px;color:#fff}
.tbtn.ext{background:#5a2bb8;border-color:#d9c2ff;font-size:12px;padding:3px 8px}
.tbtn.ext.on{background:linear-gradient(#ff8ad8,#8a4bff);box-shadow:0 0 12px #ff8ad8}
#textbox.mv #msg{padding-left:190px;font-size:19px}
</style>
</head>
<body>
<div id="loading">Cargando datos de Pokémon…</div>
<datalist id="dl-moves"></datalist>
<datalist id="dl-items"></datalist>

<section id="scr-title" class="screen on">
  <div class="gem"></div>
  <div class="logo">POKÉMON<small>ZAFIRO ALFA · DUELOS</small></div>
  <p class="tag">Forma tu equipo con cualquier Pokémon de cualquier generación, con cualquier movimiento, habilidad y objeto, y combate con las reglas completas del simulador de Pokémon Showdown.</p>
  <div class="titlebtns">
    <button class="btn gold" id="goTeam">⚔ Elegir equipo</button>
    <button class="btn" id="goTrainers">Ir a combatir</button>
    <button class="btn gold" data-league>🏆 Desafío de la Liga</button>
  </div>
  <div class="stats-line" id="dataStats"></div>
  <div class="waves"></div>
</section>

<section id="scr-team" class="screen">
  <div class="wrap">
    <div class="topbar">
      <button class="btn ghost" data-go="title">← Inicio</button>
      <h2>Tu equipo</h2>
      <button class="btn ghost" id="randTeam">🎲 Aleatorio</button>
      <button class="btn ghost" id="ieBtn">📋 Importar / Exportar</button>
      <button class="btn gold" id="teamOk" disabled>Elegir rival →</button>
    </div>
    <div class="team-layout">
      <div class="panel">
        <div class="filters"><input type="text" id="q" placeholder="Buscar Pokémon o nº…"><span id="gf"></span></div>
        <div class="filters" id="tf"></div>
        <div class="grid" id="roster"></div>
      </div>
      <div class="panel">
        <div class="slots" id="slots"></div>
        <div id="ieBox"><textarea id="ieText" spellcheck="false" placeholder="Pega aquí un equipo en formato Showdown (en inglés)"></textarea><div style="display:flex;gap:8px;margin-top:6px"><button class="btn sm" id="ieImport">Importar</button><button class="btn sm ghost" id="ieExport">Exportar mi equipo</button></div></div>
        <div class="ed" id="editor"></div>
      </div>
    </div>
  </div>
  <div class="waves"></div>
</section>

<section id="scr-trainers" class="screen">
  <div class="wrap">
    <div class="topbar">
      <button class="btn ghost" data-go="team">← Equipo</button>
      <h2>Elige a tu rival</h2>
      <button class="btn ghost" id="randBattle">🎲 Rival aleatorio</button>
      <button class="btn gold" data-league>🏆 Desafío de la Liga</button>
      <span id="myTeamPrev"></span>
    </div>
    <div class="tgrid" id="tgrid"></div>
  </div>
  <div class="waves"></div>
</section>

<section id="scr-battle" class="screen">
  <div id="stage">
    <canvas id="bg" width="960" height="540"></canvas>
    <div class="anchor" id="foeA" style="left:690px;top:218px"></div>
    <div class="anchor" id="plA" style="left:235px;top:398px"></div>
    <div id="wx"></div>
    <div id="fx"></div>
    <div id="wlabel"></div>
    <div class="hud" id="foeHud"></div>
    <div class="hud" id="plHud"></div>
    <div id="hudtools"><button id="spd">⏩ Rápido</button><button id="mute">🔊</button><button id="quit">Salir</button></div>
    <div id="textbox"><div id="msg"></div><div id="cmd"></div></div>
    <div id="switch"></div>
    <div id="intro"></div>
    <div id="result"></div>
  </div>
</section>

<script src="lib/pkmn.bundle.js"></script>
<script>
'use strict';
if(typeof PKMN==='undefined'){document.getElementById('loading').innerHTML='No se pudo cargar <b>lib/pkmn.bundle.js</b>.<br>Abre la carpeta completa del proyecto (no solo index.html).'}
else main();
function main(){
const {Dex,Teams,BattleStreams,toID,LogFormatter,Protocol,NAMES}=PKMN;

const LS={};
function learnable(sp){
  if(LS[sp.id])return LS[sp.id];
  const ids=new Set(),seen=new Set();
  (function walk(s){
    if(!s||!s.exists||seen.has(s.id))return;seen.add(s.id);
    const ld=Dex.species.getLearnsetData(s.id);if(ld&&ld.learnset)Object.keys(ld.learnset).forEach(k=>ids.add(k));
    if(s.prevo)walk(Dex.species.get(s.prevo));
    if(s.baseSpecies!==s.name)walk(Dex.species.get(s.baseSpecies));
    if(s.changesFrom)walk(Dex.species.get(s.changesFrom))})(sp);
  return LS[sp.id]=ids}
function megaStones(spName){return Dex.items.all().filter(i=>i.exists&&i.megaStone&&i.megaStone[spName]).sort((a,b)=>a.name.localeCompare(b.name))}

const UTIL=['recover','roost','softboiled','moonlight','synthesis','slackoff','swordsdance','nastyplot','calmmind','dragondance','bulkup','quiverdance','shellsmash','willowisp','thunderwave','toxic','spore','sleeppowder','stealthrock','protect','substitute','bellydrum','agility','irondefense','amnesia','curse','tailglow','coil','workup'];
function moveScore(m,sp,phys){
  let s=m.basePower*(m.accuracy===true?1:m.accuracy/100);
  if(m.multihit)s*=Array.isArray(m.multihit)?(m.multihit[0]+m.multihit[1])/2:m.multihit;
  if(sp.types.includes(m.type))s*=1.5;
  s*=(m.category==='Physical')===phys?1.2:.55;
  if(m.flags.recharge)s*=.55;if(m.flags.charge)s*=.5;if(m.selfdestruct)s*=.2;if(m.recoil)s*=.88;
  if(m.self&&m.self.boosts&&Object.values(m.self.boosts).some(v=>v<0))s*=.8;
  if(m.priority>0)s*=1.1;if(m.priority<0)s*=.7;
  if(['dreameater','focuspunch','belch','lastresort','synchronoise','steelroller','poltergeist','fakeout','firstimpression','suckerpunch','hyperspacefury','naturalgift','snore','spitup','upperhand'].includes(m.id))s*=.1;
  return s}
function suggestMoves(sp){
  const phys=sp.baseStats.atk>=sp.baseStats.spa;
  const ms=[...learnable(sp)].map(i=>Dex.moves.get(i)).filter(m=>m.exists&&!m.isZ&&!m.isMax&&!['CAP','Custom'].includes(m.isNonstandard||''));
  const dmg=ms.filter(m=>m.category!=='Status'&&m.basePower>=40).map(m=>({m,s:moveScore(m,sp,phys)})).sort((a,b)=>b.s-a.s);
  const pick=[],types=new Set();
  for(const {m} of dmg){if(pick.length>=2)break;if(sp.types.includes(m.type)&&!types.has(m.type)){pick.push(m);types.add(m.type)}}
  for(const {m} of dmg){if(pick.length>=3)break;if(!types.has(m.type)&&!pick.includes(m)){pick.push(m);types.add(m.type)}}
  const ut=UTIL.map(u=>ms.find(m=>m.id===u)).filter(Boolean);
  const setups=phys?['swordsdance','dragondance','bulkup','shellsmash','bellydrum','coil','workup']:['nastyplot','calmmind','quiverdance','tailglow','shellsmash'];
  const u=ut.find(m=>setups.includes(m.id))||ut.find(m=>!['swordsdance','dragondance','bulkup','bellydrum','coil','workup','nastyplot','calmmind','quiverdance','tailglow','shellsmash'].includes(m.id));
  if(u&&pick.length<4)pick.push(u);
  for(const {m} of dmg){if(pick.length>=4)break;if(!pick.includes(m))pick.push(m)}
  for(const m of ms){if(pick.length>=4)break;if(!pick.includes(m))pick.push(m)}
  return pick.slice(0,4).map(m=>m.name)}
function defaultSet(name,opts={}){
  const sp=Dex.species.get(name),b=sp.baseStats,off=b.atk>=b.spa?'atk':'spa';
  const stones=megaStones(sp.name);
  return{species:sp.name,level:opts.level||50,ability:sp.abilities[0],item:opts.item!==undefined?opts.item:(stones[0]?stones[0].name:'Leftovers'),
    nature:off==='atk'?'Jolly':'Timid',moves:opts.moves||suggestMoves(sp),evs:{hp:4,atk:0,def:0,spa:0,spd:0,spe:252,[off]:252},
    ivs:{hp:31,atk:31,def:31,spa:31,spd:31,spe:31},teraType:sp.types[0],name:'',gender:''}}
const calcStat=(k,base,iv,ev,lvl,nat)=>{const x=Math.floor((2*base+iv+Math.floor(ev/4))*lvl/100);if(k==='hp')return base===1?1:x+lvl+10;const n=Dex.natures.get(nat);return Math.floor((x+5)*(n.plus===k?1.1:n.minus===k?.9:1))};

      else if(m.status){const st=m.status,imm=((st==='psn'||st==='tox')&&foeSp.types.some(t=>t==='Steel'||t==='Poison'))||(st==='brn'&&foeSp.types.includes('Fire'))||(st==='par'&&foeSp.types.includes('Electric'))||(st==='slp'&&foeSp.types.includes('Grass')&&['spore','sleeppowder','stunspore'].includes(m.id));
        s=(foe&&!foe.status&&!imm)?(st==='slp'?85:60):0;
        if(m.type&&!Dex.getImmunity(m.type,{types:foeSp.types}))s=0}
      else if(m.sideCondition&&['stealthrock','spikes','toxicspikes','stickyweb'].includes(m.id))s=A.hazards?0:45;
      else if(m.sideCondition||m.weather||m.terrain)s=22;
      else if(['protect','detect','kingsshield','spikyshield','banefulbunker'].includes(m.id))s=4;
      else if(m.id==='substitute')s=myFrac>.5?20:0}
    return s*(1+(Math.random()-.5)*(1-diff)*1.2)});
  let bi=0;sc.forEach((v,i)=>{if(v>sc[bi])bi=i});
  if(diff>.55&&!act.trapped&&A.lastSwitch!==A.turns-1&&Math.random()<.4){
    const cur=matchup(me),alt=bestSwitch();
    if(alt>=0&&matchup(mons[alt])>cur+.9&&sc[bi]<foeHp*.5){A.lastSwitch=A.turns;return 'switch '+(alt+1)}}
  let ch=`move ${bi+1}`;
  if(act.canMegaEvo)ch+=' mega';else if(act.canUltraBurst)ch+=' ultra';
  else if(act.canTerastallize&&Math.random()<.2+.4*diff)ch+=' terastallize';
  else if(act.canDynamax&&Math.random()<.35)ch+=' dynamax';
  else if(act.canZMove&&act.canZMove[bi]&&Math.random()<.5)ch+=' zmove';
  const mv=Dex.moves.get(act.moves[bi].id);
  if(mv.exists&&mv.boosts&&mv.target==='self')A.boost=(A.boost||0)+1;
  if(mv.exists&&['stealthrock','spikes','toxicspikes'].includes(mv.id))A.hazards=true;
  return ch}

/* ================= COMBATE: PARTIDA ================= */
const FMT='gen9customgame';
const cleanSet=s=>({name:'',species:s.species,gender:'',item:s.item||'',ability:s.ability,moves:s.moves.slice(0,4),nature:s.nature,level:s.level||50,evs:s.evs,ivs:s.ivs,teraType:s.teraType});
async function startMatch(opts){
  ensureTeam();
  const t=opts.trainer,L=opts.league||null;
  const oppSets=opts.sets||trainerSets(t);
  const mine=MY.map(cleanSet),theirs=oppSets.map(cleanSet);
  const me=M={opts,L,trainer:t,opp:{name:t.name},diff:t.diff||.6,S:{p1:newSide(),p2:newSide()},notes:[],weather:null,fields:[],over:false,dead:false,winner:null,lastReq:null,pending:null,chain:Promise.resolve(),promptTimer:null,last:null,f:new LogFormatter('p1')};
  me.f.gen=9;me.f.p1='Tú';me.f.p2=t.name;
  show('battle');drawBG();
  $('#result').classList.remove('on');$('#cmd').classList.remove('on');$('#switch').classList.remove('on');$('#fx').innerHTML='';
  $('#foeHud').innerHTML=hudHTML('p2');$('#plHud').innerHTML=hudHTML('p1');$('#foeHud').style.display=$('#plHud').style.display='none';
  $('#foeA').innerHTML=$('#plA').innerHTML='';$('#msg').textContent='';showWx();
  const it=$('#intro');it.innerHTML=`<div class="side"><div class="avatar">🧢</div>Tú</div><div class="vs">VS</div><div class="side"><div class="avatar" id="iv2"></div>${t.name}</div>`;
  trainerImg(t,$('#iv2'));it.classList.add('on');
  anim(it.querySelector('.vs'),[{transform:'scale(3)',opacity:0},{transform:'scale(1)',opacity:1}],{duration:500});
  await wait(1700);it.classList.remove('on');if(M!==me)return;
  const streams=getPlayerStreams(new BattleStream());me.streams=streams;
  const A={foe:null,turns:0};
  (async()=>{for await(const chunk of streams.p1){if(M!==me||me.dead)return;onP1(chunk)}})();
  (async()=>{for await(const chunk of streams.p2){if(M!==me||me.dead)return;onP2(chunk,A)}})();
  streams.omniscient.write(`>start ${JSON.stringify({formatid:FMT})}`);
  streams.omniscient.write(`>player p1 ${JSON.stringify({name:'Tú',team:Teams.pack(mine)})}`);
  streams.omniscient.write(`>player p2 ${JSON.stringify({name:t.name,team:Teams.pack(theirs)})}`);
  await say(L?`Desafío de la Liga ${L.i+1}/${L.list.length}: ¡${t.name} te desafía!`:`¡${t.name} te desafía a un combate!`,500)}
function onP1(chunk){
  const m=M,log=[];
  for(const l of chunk.split('\n')){
    if(l.startsWith('|request|')){try{const r=JSON.parse(l.slice(9));m.lastReq=r;
      if(r.teamPreview){m.streams.p1.write('team '+Array.from({length:r.side.pokemon.length},(_,i)=>i+1).join(''));m.pending=null}
      else if(r.wait)m.pending=null;
      else m.pending=r}catch(e){console.error(e)}}
    else log.push(l)}
  if(log.length)m.chain=m.chain.then(()=>playLines(log)).then(()=>armPrompt());
  else armPrompt()}
function armPrompt(){
  const m=M;if(!m)return;clearTimeout(m.promptTimer);
  m.promptTimer=setTimeout(()=>{if(M===m)m.chain=m.chain.then(()=>tryPrompt(m))},120)}
async function tryPrompt(m){
  if(M!==m||m.dead)return;
  if(m.over)return finishMatch(m);
  const req=m.pending;if(!req||m.prompting)return;
  m.prompting=true;
  try{
    const ch=await promptUI(req);
    if(M!==m||m.dead)return;
    if(ch==='quit'){m.dead=true;show('trainers');return}
    m.pending=null;m.streams.p1.write(ch)}
  finally{m.prompting=false}}
function onP2(chunk,A){
  const m=M;
  for(const l of chunk.split('\n')){
    if(l[0]!=='|')continue;
    if(l.startsWith('|request|')){
      let r;try{r=JSON.parse(l.slice(9))}catch{continue}
      if(r.wait)continue;
      let ch;try{ch=aiDecide(r,A)}catch(e){console.error('IA',e);ch='default'}
      setTimeout(()=>{if(M===m&&!m.dead)m.streams.p2.write(ch)},0);continue}
    let a;try{a=Protocol.parseBattleLine(l)}catch{continue}
    const {args}=a,t=args[0],foeLine=args[1]&&String(args[1]).startsWith('p1');
    if((t==='switch'||t==='drag')&&foeLine){const hp=parseHp(args[3]);A.foe={sp:Dex.species.get(args[2].split(',')[0]),lvl:+((args[2].match(/L(\d+)/)||[,100])[1]),hp:hp.hp,max:hp.max||1,status:hp.status}}
    else if(t==='detailschange'&&foeLine&&A.foe)A.foe.sp=Dex.species.get(args[2].split(',')[0]);
    else if((t==='-damage'||t==='-heal'||t==='-sethp')&&foeLine&&A.foe){const hp=parseHp(args[2]);A.foe.hp=hp.hp;if(hp.max)A.foe.max=hp.max;A.foe.status=hp.status}
    else if(t==='-status'&&foeLine&&A.foe)A.foe.status=args[2];
    else if(t==='-curestatus'&&foeLine&&A.foe)A.foe.status='';
    else if(t==='turn')A.turns=+args[1];
    else if(t==='error')setTimeout(()=>{if(M===m&&!m.dead)m.streams.p2.write('default')},0)}}
async function finishMatch(m){
  if(m.finished)return;m.finished=true;
  const t=m.trainer,L=m.L,win=m.winner==='Tú',tie=m.winner==null;
  if(win&&t.id!=='random'){const b=store.get('zaf2.beat',{});b[t.id]=1;store.set('zaf2.beat',b)}
  await say(tie?'¡Empate!':win?`¡Has derrotado a ${t.name}!`:`¡No te quedan Pokémon! Has perdido ante ${t.name}...`,500);
  if(win&&t.id!=='random')await say(`${t.name}: “¡Un combate magnífico!”`,600);
  const r=$('#result'),btn=(id,cls,txt)=>`<button class="btn ${cls}" id="${id}">${txt}</button>`;
  if(L&&win&&L.i<L.list.length-1){
    const nx=TRAINERS.find(x=>x.id===L.list[L.i+1]);
    r.innerHTML=`<h2 style="color:#ffd24a">¡COMBATE GANADO!</h2><p>Tu equipo se recupera. Siguiente rival: <b>${nx.name}</b> (${L.i+2}/${L.list.length})</p><div style="display:flex;gap:10px">${btn('nxt','gold','Siguiente combate →')}${btn('back','ghost','Abandonar Liga')}</div>`;
    r.classList.add('on');$('#nxt').onclick=()=>startMatch({trainer:nx,league:{...L,i:L.i+1}})}
  else if(L&&win){
    r.innerHTML=`<h2 style="color:#ffd24a">🏆 ¡CAMPEÓN DE LA LIGA!</h2><p>Tu equipo entra en el Salón de la Fama</p><div id="hof" style="display:flex;gap:6px"></div><div style="display:flex;gap:10px">${btn('back','gold','Volver')}</div>`;
    MY.forEach(s=>{const i=iconEl(Dex.species.get(s.species),80);i.style.cssText='height:90px';$('#hof').append(i)});r.classList.add('on')}
  else if(L){
    r.innerHTML=`<h2 style="color:#ff8a8a">DERROTA</h2><p>Has caído en el combate ${L.i+1}/${L.list.length} de la Liga.</p><div style="display:flex;gap:10px">${btn('again','gold','Reintentar Liga')}${btn('back','ghost','Salir')}${btn('chg','ghost','Cambiar equipo')}</div>`;
    r.classList.add('on');$('#again').onclick=startLeague}
  else{
    r.innerHTML=`<h2 style="color:${tie?'#fff':win?'#ffd24a':'#ff8a8a'}">${tie?'EMPATE':win?'¡VICTORIA!':'DERROTA'}</h2><div style="display:flex;gap:10px">${btn('again','gold','Revancha')}${btn('back','','Elegir otro rival')}${btn('chg','ghost','Cambiar equipo')}</div>`;
    r.classList.add('on');$('#again').onclick=()=>{if(m.opts.random)startRandom();else startMatch({trainer:t})}}
  $('#back').onclick=()=>show('trainers');const c=$('#chg');if(c)c.onclick=()=>show('team')}

$('#spd').onclick=e=>{FAST=!FAST;e.target.textContent=FAST?'▶ Normal':'⏩ Rápido'};
$('#mute').onclick=e=>{MUTE=!MUTE;e.target.textContent=MUTE?'🔇':'🔊'};
$('#quit').onclick=()=>{if(M)M.dead=true;M=null;show('trainers')};
window.__dbg={get M(){return M},get MY(){return MY},set MY(v){MY=v},saveTeam,defaultSet,POOL,suggestMoves,startMatch,renderTeam,TRAINERS,trainerSets};
$('#loading').style.display='none';
renderTeam();
}
